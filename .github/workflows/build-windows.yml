name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      RUST_BACKTRACE: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0  # Full history for changelog

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2"

      - name: Build Tauri App
        run: cargo tauri build

      - name: Generate Changelog
        if: startsWith(github.ref, 'refs/tags/')
        id: changelog
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $prevTag = git tag --sort=-v:refname | Select-Object -Skip 1 -First 1
          
          if ($prevTag) {
            $commits = git log "$prevTag..$tag" --pretty=format:"- %s (%h)" --no-merges
          } else {
            $commits = git log --pretty=format:"- %s (%h)" --no-merges -20
          }
          
          $version = (Get-Content src-tauri/Cargo.toml | Select-String '^\s*version\s*=').Line.Split('"')[1]
          
          $changelog = @"
          ## Hermes Remote Manager $tag
          
          ### What's Changed
          $commits
          
          ### Downloads
          - **Windows Installer (NSIS):** HermesRemoteManager_${version}_x64-setup.exe
          - **Windows MSI:** hermes-remote-manager_${version}_x64_en-US.msi
          - **Portable:** hermes-remote-manager-${version}-portable.zip
          
          ### Install
          1. Download the installer or portable zip
          2. Run the installer or extract the portable zip
          3. Launch Hermes Remote Manager
          "@
          
          $changelog | Out-File -FilePath CHANGELOG_RELEASE.md -Encoding utf8
          Write-Host "Changelog generated:"
          Get-Content CHANGELOG_RELEASE.md

      - name: Debug release files
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          Write-Host "== Bundle files =="
          Get-ChildItem -Path src-tauri/target/release/bundle -Recurse -File | Select-Object FullName

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hermes-remote-manager-windows
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          body_path: CHANGELOG_RELEASE.md
          files: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          fail_on_unmatched_files: false
