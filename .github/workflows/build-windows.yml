name: Build Windows

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      RUST_BACKTRACE: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2"

      - name: Build Tauri App
        run: npx tauri build

      - name: Build portable zip
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/Cargo.toml | Select-String '^\s*version\s*=').Line.Split('"')[1]
          & ".\scripts\portable-zip.ps1" -Version $version

      - name: Upload Portable Zip
        uses: actions/upload-artifact@v4
        with:
          name: hermes-remote-manager-portable
          path: artifacts/*.zip
          if-no-files-found: error

      - name: Upload Installer Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hermes-remote-manager-windows
          path: src-tauri/target/release/bundle/*/
          if-no-files-found: error

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/*/*.{msi,exe}
            artifacts/*.zip
          generate_release_notes: true
          fail_on_unmatched_files: true